<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 개인 달력</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans m-0 p-0 min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    
    // 🔗 고정된 구글 앱스 스크립트 웹 앱 URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbwG-JOdmTz27GORlmcGexXUQBf59MxRTgH_cIvFqRt_ybBpbJfQ-8EWjHXFOGvpEr1g-Q/exec';

    // 🌟 10년치 대한민국 공식 공휴일 데이터 내장 (2024 ~ 2034)
    const KOREAN_HOLIDAYS = {
      "2024-01-01": "신정", "2024-02-09": "설날 연휴", "2024-02-10": "설날", "2024-02-11": "설날 연휴", "2024-02-12": "대체공휴일",
      "2024-03-01": "3·1절", "2024-04-10": "국회의원선거", "2024-05-05": "어린이날", "2024-05-06": "대체공휴일", "2024-05-15": "부처님오신날",
      "2024-06-06": "현충일", "2024-08-15": "광복절", "2024-09-16": "추석 연휴", "2024-09-17": "추석", "2024-09-18": "추석 연휴",
      "2024-10-03": "개천절", "2024-10-09": "한글날", "2024-12-25": "기독탄신일",

      "2025-01-01": "신정", "2025-01-28": "설날 연휴", "2025-01-29": "설날", "2025-01-30": "설날 연휴",
      "2025-03-01": "3·1절", "2025-03-03": "대체공휴일", "2025-05-05": "어린이날, 부처님오신날", "2025-05-06": "대체공휴일",
      "2025-06-06": "현충일", "2025-08-15": "광복절", "2025-10-05": "추석 연휴", "2025-10-06": "추석", "2025-10-07": "추석 연휴", "2025-10-08": "대체공휴일",
      "2025-10-03": "개천절", "2025-10-09": "한글날", "2025-12-25": "기독탄신일",

      "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
      "2026-03-01": "3·1절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
      "2026-06-06": "현충일", "2026-08-15": "광복절", "2026-08-17": "대체공휴일", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
      "2026-10-03": "개천절", "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "기독탄신일",

      "2027-01-01": "신정", "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일",
      "2027-03-01": "3·1절", "2027-05-05": "어린이날", "2027-05-13": "부처님오신날", "2027-06-06": "현충일", "2027-06-07": "대체공휴일",
      "2027-08-15": "광복절", "2027-08-16": "대체공휴일", "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴",
      "2027-10-03": "개천절", "2027-10-04": "대체공휴일", "2027-10-09": "한글날", "2027-12-25": "기독탄신일",

      "2028-01-01": "신정", "2028-01-26": "설날 연휴", "2028-01-27": "설날", "2028-01-28": "설날 연휴",
      "2028-03-01": "3·1절", "2028-05-02": "부처님오신날", "2028-05-05": "어린이날", "2028-06-06": "현충일", "2028-08-15": "광복절",
      "2028-10-02": "추석 연휴", "2028-10-03": "개천절, 추석", "2028-10-04": "추석 연휴", "2028-10-05": "대체공휴일", "2028-10-09": "한글날", "2028-12-25": "기독탄신일",

      "2029-01-01": "신정", "2029-02-12": "설날 연휴", "2029-02-13": "설날", "2029-02-14": "설날 연휴",
      "2029-03-01": "3·1절", "2029-05-05": "어린이날", "2029-05-07": "대체공휴일", "2029-05-20": "부처님오신날", "2029-05-21": "대체공휴일",
      "2029-06-06": "현충일", "2029-08-15": "광복절", "2029-09-21": "추석 연휴", "2029-09-22": "추석", "2029-09-23": "추석 연휴", "2029-09-24": "대체공휴일",
      "2029-10-03": "개천절", "2029-10-09": "한글날", "2029-12-25": "기독탄신일",

      "2030-01-01": "신정", "2030-02-01": "설날 연휴", "2030-02-02": "설날", "2030-02-03": "설날 연휴", "2030-02-04": "대체공휴일",
      "2030-03-01": "3·1절", "2030-05-05": "어린이날", "2030-05-06": "대체공휴일", "2030-05-09": "부처님오신날",
      "2030-06-06": "현충일", "2030-08-15": "광복절", "2030-09-11": "추석 연휴", "2030-09-12": "추석", "2030-09-13": "추석 연휴",
      "2030-10-03": "개천절", "2030-10-09": "한글날", "2030-12-25": "기독탄신일",

      "2031-01-01": "신정", "2031-03-01": "3·1절", "2031-05-05": "어린이날", "2031-06-06": "현충일", "2031-08-15": "광복절", "2031-10-03": "개천절", "2031-10-09": "한글날", "2031-12-25": "기독탄신일",
      "2032-01-01": "신정", "2032-03-01": "3·1절", "2032-05-05": "어린이날", "2032-06-06": "현충일", "2032-08-15": "광복절", "2032-10-03": "개천절", "2032-10-09": "한글날", "2032-12-25": "기독탄신일",
      "2033-01-01": "신정", "2033-03-01": "3·1절", "2033-05-05": "어린이날", "2033-06-06": "현충일", "2033-08-15": "광복절", "2033-10-03": "개천절", "2033-10-09": "한글날", "2033-12-25": "기독탄신일",
      "2034-01-01": "신정", "2034-03-01": "3·1절", "2034-05-05": "어린이날", "2034-06-06": "현충일", "2034-08-15": "광복절", "2034-10-03": "개천절", "2034-10-09": "한글날", "2034-12-25": "기독탄신일"
    };

    function App() {
      const [currentDate, setCurrentDate] = useState(new Date()); 
      const [events, setEvents] = useState(() => {
        try {
          const cached = localStorage.getItem('my_calendar_events_v2');
          return cached ? JSON.parse(cached) : [];
        } catch(e) {
          return [];
        }
      });
      
      const [isLoading, setIsLoading] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [syncError, setSyncError] = useState(null);

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDateDetails, setSelectedDateDetails] = useState(null); 
      const [isEventFormOpen, setIsEventFormOpen] = useState(false); 
      const [isDatePickerOpen, setIsDatePickerOpen] = useState(false);
      const [pickerYear, setPickerYear] = useState(currentDate.getFullYear());
      
      // 기간 일정 지원을 위해 startDate, endDate 분리
      const [formData, setFormData] = useState({ id: null, startDate: '', endDate: '', type: 'personal', title: '', description: '' });

      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth();

      const fetchCalendarData = async () => {
        setIsLoading(true);
        setSyncError(null);
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'get', t: new Date().getTime() })
          });
          const data = await response.json();
          if (data && data.status === 'success' && Array.isArray(data.events)) {
            setEvents(data.events);
            localStorage.setItem('my_calendar_events_v2', JSON.stringify(data.events));
            
            if (selectedDateDetails) {
              const freshEvents = data.events.filter(e => isDateInRange(selectedDateDetails.dateStr, e.startDate, e.endDate));
              setSelectedDateDetails(prev => prev ? { ...prev, events: freshEvents } : null);
            }
          }
        } catch (error) {
          console.error("동기화 실패:", error);
          setSyncError("서버 연결이 원활하지 않습니다.");
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchCalendarData();
      }, []);

      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();
      
      const formatDate = (year, month, day) => {
        return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      };

      const getHolidayName = (dateStr) => KOREAN_HOLIDAYS[dateStr] || null;

      const nextMonth = () => setCurrentDate(new Date(currentYear, currentMonth + 1, 1));
      const prevMonth = () => setCurrentDate(new Date(currentYear, currentMonth - 1, 1));

      // 날짜가 일정 범위(startDate ~ endDate)에 포함되는지 확인하는 함수
      const isDateInRange = (dateStr, start, end) => {
        if (!start) return false;
        const target = new Date(dateStr).setHours(0,0,0,0);
        const s = new Date(start).setHours(0,0,0,0);
        const e = new Date(end || start).setHours(0,0,0,0);
        return target >= s && target <= e;
      };

      const getEventsForDate = (dateStr) => {
        return events.filter(e => isDateInRange(dateStr, e.startDate, e.endDate));
      };

      const handleSaveEvent = async (e) => {
        e.preventDefault();
        if (!formData.title.trim() || !formData.startDate) return;
        
        // 종료일이 시작일보다 앞서면 시작일과 동일하게 맞춤
        const finalStartDate = formData.startDate;
        const finalEndDate = formData.endDate && formData.endDate >= finalStartDate ? formData.endDate : finalStartDate;

        setIsSaving(true);
        const isEdit = !!formData.id;
        const action = isEdit ? 'update' : 'create';
        const payloadData = {
          id: formData.id,
          startDate: finalStartDate,
          endDate: finalEndDate,
          type: formData.type,
          title: formData.title,
          description: formData.description
        };

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, data: payloadData })
          });
          const result = await response.json();

          if (result.status === 'success') {
            await fetchCalendarData();
            setIsEventFormOpen(false);
            setFormData({ id: null, startDate: '', endDate: '', type: 'personal', title: '', description: '' });
          } else {
            setSyncError("저장에 실패했습니다.");
          }
        } catch (error) {
          console.error("저장 오류:", error);
          setSyncError("서버와 통신하는 중 오류가 발생했습니다.");
        } finally {
          setIsSaving(false);
        }
      };

      const handleDeleteEvent = async (id) => {
        setIsSaving(true);
        try {
          const payload = { action: 'delete', data: { id } };
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (result.status === 'success') {
            await fetchCalendarData();
            setIsEventFormOpen(false);
            setSelectedDateDetails(null);
          }
        } catch (error) {
          setSyncError("삭제 중 오류가 발생했습니다.");
        } finally {
          setIsSaving(false);
        }
      };

      const handleEditEvent = (evt) => {
        setFormData({
          id: evt.id,
          startDate: evt.startDate,
          endDate: evt.endDate || evt.startDate,
          type: evt.type,
          title: evt.title,
          description: evt.description
        });
        setIsEventFormOpen(true);
      };

      const filteredSearchEvents = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const lowerQuery = searchQuery.toLowerCase();
        return events.filter(evt => 
          evt.title.toLowerCase().includes(lowerQuery) || 
          evt.description.toLowerCase().includes(lowerQuery)
        ).sort((a, b) => new Date(a.startDate).getTime() - new Date(b.startDate).getTime());
      }, [searchQuery, events]);

      const renderCalendar = () => {
        const daysInMonth = getDaysInMonth(currentYear, currentMonth);
        const firstDay = getFirstDayOfMonth(currentYear, currentMonth);
        const prevMonthDays = getDaysInMonth(currentYear, currentMonth - 1);
        const days = [];

        const renderDayCell = (year, month, day, isCurrentMonth) => {
          const dateStr = formatDate(year, month, day);
          const dayEvents = getEventsForDate(dateStr);
          
          const today = new Date();
          const isToday = dateStr === formatDate(today.getFullYear(), today.getMonth(), today.getDate());
          
          const dayOfWeek = new Date(year, month, day).getDay();
          const isSunday = dayOfWeek === 0;
          const isSaturday = dayOfWeek === 6;
          
          const holidayName = getHolidayName(dateStr);
          const isHoliday = !!holidayName;
          const isRedDay = isSunday || isHoliday;

          let dateTextColor = isCurrentMonth ? 'text-slate-200' : 'text-slate-500/50';
          if (isRedDay) {
            dateTextColor = isCurrentMonth ? 'text-rose-400 font-bold' : 'text-rose-900/60 font-medium';
          } else if (isSaturday) {
            dateTextColor = isCurrentMonth ? 'text-blue-400 font-bold' : 'text-blue-900/60 font-medium';
          }

          let bgColor = isCurrentMonth ? 'bg-slate-800' : 'bg-slate-800/40';
          if (isCurrentMonth && isRedDay) bgColor = 'bg-rose-950/20';
          if (!isCurrentMonth && isRedDay) bgColor = 'bg-rose-950/10';
          
          let ringStyle = isToday ? 'ring-2 ring-blue-500 ring-inset z-10' : '';

          return (
            <div 
              key={`${year}-${month}-${day}`} 
              onClick={() => setSelectedDateDetails({ day, dateStr, events: dayEvents })}
              className={`p-1 sm:p-2 border border-slate-700 flex-1 min-h-[70px] sm:min-h-[100px] cursor-pointer transition-colors hover:bg-slate-700 relative group flex flex-col ${bgColor} ${ringStyle}`}
            >
              <div className="flex justify-between items-start mb-0.5">
                <div className="flex flex-col">
                  <span className={`text-xs sm:text-sm w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-blue-600 text-white font-bold' : dateTextColor}`}>
                    {day}
                  </span>
                  {isHoliday && (
                    <span className={`text-[8px] sm:text-[10px] truncate leading-tight mt-0.5 ${isCurrentMonth ? 'text-rose-400 font-bold' : 'text-rose-900/60 font-medium'}`}>
                      {holidayName}
                    </span>
                  )}
                </div>
                {dayEvents.length > 0 && (
                  <span className="text-[9px] text-slate-400 sm:hidden bg-slate-700 px-1 py-0.2 rounded-full">{dayEvents.length}</span>
                )}
              </div>
              
              <div className="space-y-0.5 overflow-y-auto flex-1 no-scrollbar mt-0.5">
                {dayEvents.map(evt => (
                  <div 
                    key={evt.id} 
                    className={`text-[9px] sm:text-xs truncate px-1 py-0.5 rounded font-bold shadow-sm ${!isCurrentMonth && 'opacity-40'}
                    ${evt.type === 'work' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}`}
                  >
                    {evt.title}
                  </div>
                ))}
              </div>
            </div>
          );
        };

        const prevMonthNum = currentMonth === 0 ? 11 : currentMonth - 1;
        const prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
        for (let i = 0; i < firstDay; i++) {
          const day = prevMonthDays - firstDay + i + 1;
          days.push(renderDayCell(prevYear, prevMonthNum, day, false));
        }

        for (let day = 1; day <= daysInMonth; day++) {
          days.push(renderDayCell(currentYear, currentMonth, day, true));
        }

        const totalCells = firstDay + daysInMonth;
        const nextDays = (7 - (totalCells % 7)) % 7;
        const nextMonthNum = currentMonth === 11 ? 0 : currentMonth + 1;
        const nextYear = currentMonth === 11 ? currentYear + 1 : currentYear;
        
        for (let i = 1; i <= nextDays; i++) {
          days.push(renderDayCell(nextYear, nextMonthNum, i, false));
        }

        return days;
      };

      return (
        <div className="min-h-screen flex flex-col p-1 sm:p-4 md:p-8 bg-slate-900">
          <div className="max-w-5xl w-full mx-auto bg-slate-800 rounded-2xl shadow-xl border border-slate-700 flex flex-col flex-1 overflow-hidden relative">
            
            {syncError && (
              <div className="bg-rose-900/90 text-white text-xs sm:text-sm px-4 py-2 flex items-center justify-between">
                <span>{syncError}</span>
                <button onClick={() => setSyncError(null)} className="hover:text-rose-200"><i className="fa-solid fa-xmark text-base"></i></button>
              </div>
            )}

            {/* 헤더 바 */}
            <div className="flex flex-col sm:flex-row items-center justify-between p-3 sm:p-6 border-b border-slate-700 gap-3 shrink-0">
              <div className="flex items-center gap-3">
                <button onClick={prevMonth} className="p-2 hover:bg-slate-700 rounded-full transition-colors text-slate-400 hover:text-white">
                  <i className="fa-solid fa-chevron-left text-lg"></i>
                </button>
                
                <h2 
                  onClick={() => { setPickerYear(currentYear); setIsDatePickerOpen(true); }}
                  className="text-lg sm:text-2xl font-bold flex items-center gap-2 min-w-[110px] justify-center cursor-pointer hover:bg-slate-700 px-3 py-1.5 rounded-xl transition-colors text-white group"
                >
                  <i className="fa-regular fa-calendar text-blue-500 hidden sm:block group-hover:scale-110 transition-transform text-xl"></i>
                  {currentYear}년 {currentMonth + 1}월
                </h2>
                
                <button onClick={nextMonth} className="p-2 hover:bg-slate-700 rounded-full transition-colors text-slate-400 hover:text-white">
                  <i className="fa-solid fa-chevron-right text-lg"></i>
                </button>
              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                {isLoading ? (
                   <div className="text-slate-400 text-xs sm:text-sm flex items-center gap-1.5 pr-2">
                     <i className="fa-solid fa-spinner fa-spin text-sm"></i> 동기화 중...
                   </div>
                ) : (
                   <button onClick={fetchCalendarData} className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-full transition-colors" title="새로고침">
                     <i className="fa-solid fa-rotate text-base"></i>
                   </button>
                )}
                
                <div className="relative flex-1 sm:w-48">
                  <input 
                    type="text" 
                    placeholder="일정 검색..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-8 pr-3 py-1.5 bg-slate-900 border-transparent focus:bg-slate-950 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 rounded-lg text-xs sm:text-sm transition-all outline-none text-slate-200 placeholder-slate-500 shadow-inner"
                  />
                  <i className="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-xs"></i>
                </div>
                
                <button 
                  onClick={() => {
                    const todayStr = formatDate(currentYear, currentMonth, new Date().getDate());
                    setFormData({ id: null, startDate: todayStr, endDate: todayStr, type: 'personal', title: '', description: '' });
                    setIsEventFormOpen(true);
                  }}
                  className="bg-blue-600 hover:bg-blue-500 text-white p-2 sm:px-4 rounded-lg flex items-center gap-1 transition-colors whitespace-nowrap shadow-sm font-medium text-xs sm:text-sm"
                >
                  <i className="fa-solid fa-plus text-sm"></i>
                  <span className="hidden sm:inline">일정 추가</span>
                </button>
              </div>
            </div>

            {/* 검색 결과 화면 또는 달력 그리드 */}
            {searchQuery.trim() ? (
              <div className="p-4 sm:p-6 bg-slate-800 flex-1 overflow-y-auto">
                <h3 className="text-base sm:text-lg font-bold mb-4 flex items-center gap-2 text-white">
                  <i className="fa-solid fa-magnifying-glass text-blue-400 text-base"></i> 
                  "{searchQuery}" 검색 결과 ({filteredSearchEvents.length}건)
                </h3>
                {filteredSearchEvents.length > 0 ? (
                  <div className="space-y-3">
                    {filteredSearchEvents.map(evt => (
                      <div key={evt.id} className="bg-slate-700 p-3 sm:p-4 rounded-xl shadow-sm border border-slate-600 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-xs sm:text-sm font-medium text-slate-300 bg-slate-800 border border-slate-600 px-2 py-0.5 rounded-md">
                              {evt.startDate} {evt.endDate && evt.endDate !== evt.startDate ? `~ ${evt.endDate}` : ''}
                            </span>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 font-bold border ${evt.type === 'work' ? 'bg-blue-500/20 text-blue-300 border-blue-500/30' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'}`}>
                              {evt.type === 'work' ? '업무' : '개인'}
                            </span>
                          </div>
                          <h4 className="font-bold text-white text-sm sm:text-base">{evt.title}</h4>
                          <p className="text-xs sm:text-sm text-slate-400 mt-1">{evt.description}</p>
                        </div>
                        <button 
                          onClick={() => handleEditEvent(evt)}
                          className="text-xs sm:text-sm px-3 py-1.5 bg-slate-600 hover:bg-slate-500 text-white rounded-lg transition-colors shrink-0 flex items-center justify-center gap-1"
                        >
                          <i className="fa-solid fa-pen text-xs"></i> 수정하기
                        </button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-center text-slate-500 py-12">검색 결과가 없습니다.</div>
                )}
              </div>
            ) : (
              <div className="p-2 sm:p-6 flex-1 flex flex-col">
                <div className="grid grid-cols-7 mb-1 shrink-0">
                  {['일', '월', '화', '수', '목', '금', '토'].map((day, i) => (
                    <div key={day} className={`text-center text-xs sm:text-sm font-semibold py-1.5
                      ${i === 0 ? 'text-rose-400' : (i === 6 ? 'text-blue-400' : 'text-slate-400')}`}>
                      {day}
                    </div>
                  ))}
                </div>
                <div className="grid grid-cols-7 gap-px bg-slate-700 border border-slate-700 rounded-xl overflow-hidden shadow-sm flex-1">
                  {renderCalendar()}
                </div>
              </div>
            )}

            {/* 날짜 상세 팝업 */}
            {selectedDateDetails && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-3 backdrop-blur-sm">
                <div className="bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl w-full max-w-sm sm:max-w-md overflow-hidden flex flex-col max-h-[85vh]">
                  <div className="flex items-center justify-between p-4 border-b border-slate-700 bg-slate-700/80">
                    <h3 className="font-bold text-base sm:text-lg flex items-center gap-2">
                      <span className="bg-slate-900 px-2 py-1 rounded-lg border border-slate-600 text-blue-400 shadow-sm">{selectedDateDetails.day}일</span>
                      <span className="text-slate-300 text-xs sm:text-sm font-normal">{currentYear}년 {currentMonth + 1}월</span>
                    </h3>
                    <button onClick={() => setSelectedDateDetails(null)} className="p-1.5 hover:bg-slate-600 rounded-full text-slate-400 hover:text-white transition-colors">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>
                  
                  <div className="p-4 overflow-y-auto flex-1 space-y-3">
                    {selectedDateDetails.events.length > 0 ? (
                      selectedDateDetails.events.map(evt => (
                        <div key={evt.id} className="bg-slate-700 p-3.5 rounded-xl shadow-sm border border-slate-600 relative overflow-hidden">
                          <div className={`absolute top-0 left-0 w-1 h-full ${evt.type === 'work' ? 'bg-blue-500' : 'bg-emerald-500'}`}></div>
                          <div className="flex items-start justify-between">
                            <div className="flex flex-col gap-1 mb-2 pl-2">
                              <div className="flex items-center gap-2">
                                <span className={`text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 font-bold border ${evt.type === 'work' ? 'bg-blue-500/20 text-blue-300 border-blue-500/30' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'}`}>
                                  {evt.type === 'work' ? <i className="fa-solid fa-briefcase text-[10px]"></i> : <i className="fa-solid fa-user text-[10px]"></i>}
                                  {evt.type === 'work' ? '업무' : '개인'}
                                </span>
                                <span className="text-xs text-slate-400">
                                  {evt.startDate} {evt.endDate && evt.endDate !== evt.startDate ? `~ ${evt.endDate}` : ''}
                                </span>
                              </div>
                              <h4 className="font-semibold text-white text-base">{evt.title}</h4>
                            </div>
                            <button 
                              onClick={(e) => { e.stopPropagation(); handleEditEvent(evt); }}
                              className="text-slate-400 hover:text-blue-400 hover:bg-slate-600 p-1.5 rounded-md transition-colors"
                            >
                              <i className="fa-solid fa-pen text-sm"></i>
                            </button>
                          </div>
                          {evt.description && (
                            <div className="pl-2 flex gap-2 text-slate-200 text-xs sm:text-sm mt-2 bg-slate-800/50 p-2.5 rounded-lg border border-slate-600">
                              <i className="fa-solid fa-file-lines shrink-0 text-slate-400 mt-0.5"></i>
                              <p className="whitespace-pre-wrap leading-relaxed">{evt.description}</p>
                            </div>
                          )}
                        </div>
                      ))
                    ) : (
                      <div className="text-center py-10 text-slate-500 flex flex-col items-center">
                        <i className="fa-regular fa-calendar mb-2 opacity-20 text-3xl"></i>
                        <p className="text-sm">등록된 일정이 없습니다.</p>
                      </div>
                    )}
                  </div>
                  
                  <div className="p-3 border-t border-slate-700 bg-slate-800">
                    <button 
                      onClick={() => {
                        setFormData({ id: null, startDate: selectedDateDetails.dateStr, endDate: selectedDateDetails.dateStr, type: 'personal', title: '', description: '' });
                        setIsEventFormOpen(true);
                      }}
                      className="w-full bg-slate-700 border border-slate-600 text-blue-400 hover:text-blue-300 hover:bg-slate-600 py-2.5 rounded-lg font-medium transition-colors text-sm flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-plus text-sm"></i> 이 날짜에 일정 추가
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 일정 추가/수정 모달 (시작일~종료일 선택 기능 포함) */}
            {isEventFormOpen && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-3 backdrop-blur-sm">
                <div className="bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden relative">
                  
                  {isSaving && (
                    <div className="absolute inset-0 bg-slate-900/60 z-10 flex flex-col items-center justify-center backdrop-blur-sm">
                      <i className="fa-solid fa-spinner fa-spin text-blue-500 mb-2 text-2xl"></i>
                      <span className="text-xs sm:text-sm font-medium text-white">시트에 기록 중...</span>
                    </div>
                  )}

                  <div className="flex items-center justify-between p-4 border-b border-slate-700 bg-slate-700/80">
                    <h3 className="font-bold text-base sm:text-lg text-white">{formData.id ? '일정 수정' : '새 일정 추가'}</h3>
                    <button onClick={() => !isSaving && setIsEventFormOpen(false)} className="p-1 hover:bg-slate-600 rounded-full text-slate-400 hover:text-white transition-colors">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>
                  
                  <form onSubmit={handleSaveEvent} className="p-4 sm:p-5 space-y-3.5">
                    {/* 기간 설정 (시작일 ~ 종료일) */}
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] sm:text-xs font-medium text-slate-300 mb-1">시작일</label>
                        <input 
                          type="date" required value={formData.startDate}
                          onChange={e => setFormData({...formData, startDate: e.target.value})}
                          className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all text-xs sm:text-sm text-slate-200 shadow-inner"
                          style={{ colorScheme: 'dark' }}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] sm:text-xs font-medium text-slate-300 mb-1">종료일 (연속 일정)</label>
                        <input 
                          type="date" value={formData.endDate}
                          onChange={e => setFormData({...formData, endDate: e.target.value})}
                          placeholder="당일인 경우 비워둠"
                          className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all text-xs sm:text-sm text-slate-200 shadow-inner"
                          style={{ colorScheme: 'dark' }}
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] sm:text-xs font-medium text-slate-300 mb-1">구분</label>
                      <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-700 shadow-inner">
                        <button 
                          type="button" onClick={() => setFormData({...formData, type: 'work'})}
                          className={`flex-1 py-1.5 text-xs font-bold rounded-md flex justify-center items-center gap-1 transition-all
                            ${formData.type === 'work' ? 'bg-slate-700 shadow-sm text-blue-400 border border-slate-600' : 'text-slate-500 hover:text-slate-300'}`}
                        >
                          <i className="fa-solid fa-briefcase"></i> 업무
                        </button>
                        <button 
                          type="button" onClick={() => setFormData({...formData, type: 'personal'})}
                          className={`flex-1 py-1.5 text-xs font-bold rounded-md flex justify-center items-center gap-1 transition-all
                            ${formData.type === 'personal' ? 'bg-slate-700 shadow-sm text-emerald-300 border border-slate-600' : 'text-slate-500 hover:text-slate-300'}`}
                        >
                          <i className="fa-solid fa-user"></i> 개인
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] sm:text-xs font-medium text-slate-300 mb-1">제목 (요약)</label>
                      <input 
                        type="text" required placeholder="예: 제주도 여행" value={formData.title}
                        onChange={e => setFormData({...formData, title: e.target.value})}
                        className="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm text-slate-200 placeholder-slate-600 shadow-inner"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] sm:text-xs font-medium text-slate-300 mb-1">상세 내용</label>
                      <textarea 
                        rows={3} placeholder="장소, 시간, 준비물 등" value={formData.description}
                        onChange={e => setFormData({...formData, description: e.target.value})}
                        className="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none text-xs sm:text-sm text-slate-200 placeholder-slate-600 shadow-inner"
                      ></textarea>
                    </div>

                    <div className="pt-3 mt-1 border-t border-slate-700 flex justify-between gap-2">
                      {formData.id && (
                        <button 
                          type="button" onClick={() => handleDeleteEvent(formData.id)} disabled={isSaving}
                          className="px-3 py-2.5 bg-rose-950/40 text-rose-400 rounded-lg font-medium hover:bg-rose-900/60 transition-colors flex items-center justify-center shadow-sm border border-rose-900/50 disabled:opacity-50"
                        >
                          <i className="fa-solid fa-trash text-sm"></i>
                        </button>
                      )}
                      <div className="flex gap-2 flex-1">
                        <button 
                          type="button" onClick={() => setIsEventFormOpen(false)} disabled={isSaving}
                          className="flex-1 px-4 py-2.5 bg-slate-700 text-slate-300 rounded-lg font-medium hover:bg-slate-600 hover:text-white transition-colors border border-slate-600 text-sm disabled:opacity-50"
                        >취소</button>
                        <button 
                          type="submit" disabled={isSaving}
                          className="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-500 transition-colors shadow-sm text-sm disabled:opacity-50"
                        >저장하기</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* 연도/월 선택 모달 */}
            {isDatePickerOpen && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[70] p-3 backdrop-blur-sm">
                <div className="bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden">
                  <div className="flex items-center justify-between p-4 border-b border-slate-700 bg-slate-700/80">
                    <h3 className="font-bold text-base text-white">날짜 이동</h3>
                    <button onClick={() => setIsDatePickerOpen(false)} className="p-1.5 hover:bg-slate-600 rounded-full text-slate-400 hover:text-white transition-colors">
                      <i className="fa-solid fa-xmark text-base"></i>
                    </button>
                  </div>
                  
                  <div className="p-4">
                    <div className="flex items-center justify-between mb-4 bg-slate-900 border border-slate-700 p-2 rounded-xl shadow-inner">
                      <button onClick={() => setPickerYear(prev => prev - 1)} className="p-2 hover:bg-slate-700 rounded-lg transition-colors text-slate-400 hover:text-white">
                        <i className="fa-solid fa-chevron-left text-sm"></i>
                      </button>
                      <span className="text-base font-bold text-white">{pickerYear}년</span>
                      <button onClick={() => setPickerYear(prev => prev + 1)} className="p-2 hover:bg-slate-700 rounded-lg transition-colors text-slate-400 hover:text-white">
                        <i className="fa-solid fa-chevron-right text-sm"></i>
                      </button>
                    </div>
                    
                    <div className="grid grid-cols-4 gap-2">
                      {Array.from({length: 12}, (_, i) => i + 1).map(month => {
                        const isSelected = pickerYear === currentYear && (month - 1) === currentMonth;
                        return (
                          <button
                            key={month}
                            onClick={() => { setCurrentDate(new Date(pickerYear, month - 1, 1)); setIsDatePickerOpen(false); }}
                            className={`py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all
                              ${isSelected ? 'bg-blue-600 text-white shadow-md scale-105' : 'bg-slate-700 border border-slate-600 text-slate-300 hover:bg-slate-600 hover:text-white'}`}
                          >
                            {month}월
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  
                  <div className="p-3 border-t border-slate-700 bg-slate-700/50">
                    <button 
                      onClick={() => { setCurrentDate(new Date()); setIsDatePickerOpen(false); }}
                      className="w-full bg-slate-700 border border-slate-600 text-slate-200 hover:bg-slate-600 hover:text-white py-2 rounded-lg font-medium transition-colors text-xs shadow-sm"
                    >오늘 날짜로 돌아가기</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
