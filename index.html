<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 개인 달력</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    /* Prevent pull-to-refresh and bounce on mobile */
    html, body { overscroll-behavior-y: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans m-0 p-0 h-[100dvh] w-screen overflow-hidden flex flex-col select-none">
  <div id="root" class="flex-1 flex flex-col h-full w-full overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    
    const API_URL = 'https://script.google.com/macros/s/AKfycbwG-JOdmTz27GORlmcGexXUQBf59MxRTgH_cIvFqRt_ybBpbJfQ-8EWjHXFOGvpEr1g-Q/exec';

    // 10-year official Korean holidays (2024 ~ 2034)
    const KOREAN_HOLIDAYS = {
      "2024-01-01": "신정", "2024-02-09": "설날 연휴", "2024-02-10": "설날", "2024-02-11": "설날 연휴", "2024-02-12": "대체공휴일",
      "2024-03-01": "3·1절", "2024-04-10": "국회의원선거", "2024-05-05": "어린이날", "2024-05-06": "대체공휴일", "2024-05-15": "부처님오신날",
      "2024-06-06": "현충일", "2024-08-15": "광복절", "2024-09-16": "추석 연휴", "2024-09-17": "추석", "2024-09-18": "추석 연휴",
      "2024-10-03": "개천절", "2024-10-09": "한글날", "2024-12-25": "기독탄신일",

      "2025-01-01": "신정", "2025-01-28": "설날 연휴", "2025-01-29": "설날", "2025-01-30": "설날 연휴",
      "2025-03-01": "3·1절", "2025-03-03": "대체공휴일", "2025-05-05": "어린이날, 부처님오신날", "2025-05-06": "대체공휴일",
      "2025-06-06": "현충일", "2025-08-15": "광복절", "2025-10-05": "추석 연휴", "2025-10-06": "추석", "2025-10-07": "추석 연휴", "2025-10-08": "대체공휴일",
      "2025-10-03": "개천절", "2025-10-09": "한글날", "2025-12-25": "기독탄신일",

      "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
      "2026-03-01": "3·1절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
      "2026-06-06": "현충일", "2026-08-15": "광복절", "2026-08-17": "대체공휴일", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
      "2026-10-03": "개천절", "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "기독탄신일",

      "2027-01-01": "신정", "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일",
      "2027-03-01": "3·1절", "2027-05-05": "어린이날", "2027-05-13": "부처님오신날", "2027-06-06": "현충일", "2027-06-07": "대체공휴일",
      "2027-08-15": "광복절", "2027-08-16": "대체공휴일", "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴",
      "2027-10-03": "개천절", "2027-10-04": "대체공휴일", "2027-10-09": "한글날", "2027-12-25": "기독탄신일",

      "2028-01-01": "신정", "2028-01-26": "설날 연휴", "2028-01-27": "설날", "2028-01-28": "설날 연휴",
      "2028-03-01": "3·1절", "2028-05-02": "부처님오신날", "2028-05-05": "어린이날", "2028-06-06": "현충일", "2028-08-15": "광복절",
      "2028-10-02": "추석 연휴", "2028-10-03": "개천절, 추석", "2028-10-04": "추석 연휴", "2028-10-05": "대체공휴일", "2028-10-09": "한글날", "2028-12-25": "기독탄신일",

      "2029-01-01": "신정", "2029-02-12": "설날 연휴", "2029-02-13": "설날", "2029-02-14": "설날 연휴",
      "2029-03-01": "3·1절", "2029-05-05": "어린이날", "2029-05-07": "대체공휴일", "2029-05-20": "부처님오신날", "2029-05-21": "대체공휴일",
      "2029-06-06": "현충일", "2029-08-15": "광복절", "2029-09-21": "추석 연휴", "2029-09-22": "추석", "2029-09-23": "추석 연휴", "2029-09-24": "대체공휴일",
      "2029-10-03": "개천절", "2029-10-09": "한글날", "2029-12-25": "기독탄신일",

      "2030-01-01": "신정", "2030-02-01": "설날 연휴", "2030-02-02": "설날", "2030-02-03": "설날 연휴", "2030-02-04": "대체공휴일",
      "2030-03-01": "3·1절", "2030-05-05": "어린이날", "2030-05-06": "대체공휴일", "2030-05-09": "부처님오신날",
      "2030-06-06": "현충일", "2030-08-15": "광복절", "2030-09-11": "추석 연휴", "2030-09-12": "추석", "2030-09-13": "추석 연휴",
      "2030-10-03": "개천절", "2030-10-09": "한글날", "2030-12-25": "기독탄신일",

      "2031-01-01": "신정", "2031-03-01": "3·1절", "2031-05-05": "어린이날", "2031-06-06": "현충일", "2031-08-15": "광복절", "2031-10-03": "개천절", "2031-10-09": "한글날", "2031-12-25": "기독탄신일",
      "2032-01-01": "신정", "2032-03-01": "3·1절", "2032-05-05": "어린이날", "2032-06-06": "현충일", "2032-08-15": "광복절", "2032-10-03": "개천절", "2032-10-09": "한글날", "2032-12-25": "기독탄신일",
      "2033-01-01": "신정", "2033-03-01": "3·1절", "2033-05-05": "어린이날", "2033-06-06": "현충일", "2033-08-15": "광복절", "2033-10-03": "개천절", "2033-10-09": "한글날", "2033-12-25": "기독탄신일",
      "2034-01-01": "신정", "2034-03-01": "3·1절", "2034-05-05": "어린이날", "2034-06-06": "현충일", "2034-08-15": "광복절", "2034-10-03": "개천절", "2034-10-09": "한글날", "2034-12-25": "기독탄신일"
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pin, setPin] = useState([]);
      const [isError, setIsError] = useState(false);

      const [currentDate, setCurrentDate] = useState(new Date()); 
      const [events, setEvents] = useState(() => {
        try {
          const cached = localStorage.getItem('my_calendar_events_v6');
          return cached ? JSON.parse(cached) : [];
        } catch(e) {
          return [];
        }
      });
      
      const [isLoading, setIsLoading] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [syncError, setSyncError] = useState(null);

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDateDetails, setSelectedDateDetails] = useState(null); 
      const [isEventFormOpen, setIsEventFormOpen] = useState(false); 
      const [isDatePickerOpen, setIsDatePickerOpen] = useState(false);
      const [pickerYear, setPickerYear] = useState(currentDate.getFullYear());
      
      const [formData, setFormData] = useState({ id: null, startDate: '', endDate: '', type: 'personal', title: '', description: '' });

      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth();

      const fetchCalendarData = async () => {
        setIsLoading(true);
        setSyncError(null);
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'get', t: new Date().getTime() })
          });
          const data = await response.json();
          if (data && data.status === 'success' && Array.isArray(data.events)) {
            setEvents(data.events);
            localStorage.setItem('my_calendar_events_v6', JSON.stringify(data.events));
            
            if (selectedDateDetails) {
              const freshEvents = data.events.filter(e => isDateInRange(selectedDateDetails.dateStr, e.startDate, e.endDate));
              setSelectedDateDetails(prev => prev ? { ...prev, events: freshEvents } : null);
            }
          }
        } catch (error) {
          console.error("동기화 실패:", error);
          setSyncError("서버 연결이 원활하지 않습니다.");
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          fetchCalendarData();
        }
      }, [isAuthenticated]);

      // PIN entry handler with automatic submission on 4 digits
      const handlePinPress = (num) => {
        if (pin.length < 4) {
          const newPin = [...pin, num];
          setPin(newPin);
          if (newPin.length === 4) {
            const entered = newPin.join('');
            if (entered === '1017') {
              setIsAuthenticated(true);
            } else {
              setIsError(true);
              setTimeout(() => {
                setPin([]);
                setIsError(false);
              }, 400);
            }
          }
        }
      };

      const handlePinDelete = () => {
        if (pin.length > 0) {
          setPin(pin.slice(0, -1));
        }
      };

      const handlePinClear = () => {
        setPin([]);
      };

      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();
      
      const formatDate = (year, month, day) => {
        return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      };

      const getHolidayName = (dateStr) => KOREAN_HOLIDAYS[dateStr] || null;

      const nextMonth = () => setCurrentDate(new Date(currentYear, currentMonth + 1, 1));
      const prevMonth = () => setCurrentDate(new Date(currentYear, currentMonth - 1, 1));

      const isDateInRange = (dateStr, start, end) => {
        if (!start) return false;
        const target = new Date(dateStr).setHours(0,0,0,0);
        const s = new Date(start).setHours(0,0,0,0);
        const e = new Date(end || start).setHours(0,0,0,0);
        return target >= s && target <= e;
      };

      const getEventsForDate = (dateStr) => {
        return events.filter(e => isDateInRange(dateStr, e.startDate, e.endDate));
      };

      const handleSaveEvent = async (e) => {
        e.preventDefault();
        if (!formData.title.trim() || !formData.startDate) return;
        
        const finalStartDate = formData.startDate;
        const finalEndDate = formData.endDate && formData.endDate >= finalStartDate ? formData.endDate : finalStartDate;

        setIsSaving(true);
        const isEdit = !!formData.id;
        const action = isEdit ? 'update' : 'create';
        const payloadData = {
          id: formData.id,
          startDate: finalStartDate,
          endDate: finalEndDate,
          type: formData.type,
          title: formData.title,
          description: formData.description
        };

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, data: payloadData })
          });
          const result = await response.json();

          if (result.status === 'success') {
            await fetchCalendarData();
            setIsEventFormOpen(false);
            setFormData({ id: null, startDate: '', endDate: '', type: 'personal', title: '', description: '' });
          } else {
            setSyncError("저장에 실패했습니다.");
          }
        } catch (error) {
          console.error("저장 오류:", error);
          setSyncError("서버와 통신하는 중 오류가 발생했습니다.");
        } finally {
          setIsSaving(false);
        }
      };

      const handleDeleteEvent = async (id) => {
        setIsSaving(true);
        try {
          const payload = { action: 'delete', data: { id } };
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (result.status === 'success') {
            await fetchCalendarData();
            setIsEventFormOpen(false);
            setSelectedDateDetails(null);
          }
        } catch (error) {
          setSyncError("삭제 중 오류가 발생했습니다.");
        } finally {
          setIsSaving(false);
        }
      };

      const handleEditEvent = (evt) => {
        setFormData({
          id: evt.id,
          startDate: evt.startDate,
          endDate: evt.endDate || evt.startDate,
          type: evt.type,
          title: evt.title,
          description: evt.description
        });
        setIsEventFormOpen(true);
      };

      const filteredSearchEvents = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const lowerQuery = searchQuery.toLowerCase();
        return events.filter(evt => 
          evt.title.toLowerCase().includes(lowerQuery) || 
          evt.description.toLowerCase().includes(lowerQuery)
        ).sort((a, b) => new Date(a.startDate).getTime() - new Date(b.startDate).getTime());
      }, [searchQuery, events]);

      const renderCalendar = () => {
        const daysInMonth = getDaysInMonth(currentYear, currentMonth);
        const firstDay = getFirstDayOfMonth(currentYear, currentMonth);
        const prevMonthDays = getDaysInMonth(currentYear, currentMonth - 1);
        const days = [];

        const renderDayCell = (year, month, day, isCurrentMonth) => {
          const dateStr = formatDate(year, month, day);
          const dayEvents = getEventsForDate(dateStr);
          
          const today = new Date();
          const isToday = dateStr === formatDate(today.getFullYear(), today.getMonth(), today.getDate());
          
          const dayOfWeek = new Date(year, month, day).getDay();
          const isSunday = dayOfWeek === 0;
          const isSaturday = dayOfWeek === 6;
          
          const holidayName = getHolidayName(dateStr);
          const isHoliday = !!holidayName;
          const isRedDay = isSunday || isHoliday;

          let dateTextColor = isCurrentMonth ? 'text-slate-200' : 'text-slate-500/40';
          if (isRedDay) {
            dateTextColor = isCurrentMonth ? 'text-rose-400 font-bold' : 'text-rose-900/50 font-medium';
          } else if (isSaturday) {
            dateTextColor = isCurrentMonth ? 'text-blue-400 font-bold' : 'text-blue-900/50 font-medium';
          }

          let bgColor = isCurrentMonth ? 'bg-slate-800' : 'bg-slate-800/30';
          if (isCurrentMonth && isRedDay) bgColor = 'bg-rose-950/20';
          
          let ringStyle = isToday ? 'ring-2 ring-blue-500 ring-inset z-10' : '';

          return (
            <div 
              key={`${year}-${month}-${day}`} 
              onClick={() => setSelectedDateDetails({ day, dateStr, events: dayEvents })}
              className={`p-1 border border-slate-700/60 flex flex-col cursor-pointer transition-colors hover:bg-slate-700 relative overflow-hidden ${bgColor} ${ringStyle}`}
            >
              <div className="flex justify-between items-start mb-0.5 shrink-0">
                <div className="flex flex-col">
                  <span className={`text-xs sm:text-sm w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-blue-600 text-white font-bold' : dateTextColor}`}>
                    {day}
                  </span>
                  {isHoliday && (
                    <span className={`text-[8px] sm:text-[10px] truncate leading-none mt-0.5 ${isCurrentMonth ? 'text-rose-400 font-bold' : 'text-rose-900/50'}`}>
                      {holidayName}
                    </span>
                  )}
                </div>
                {dayEvents.length > 0 && (
                  <span className="text-[9px] text-slate-400 sm:hidden bg-slate-700 px-1 rounded">{dayEvents.length}</span>
                )}
              </div>
              
              <div className="space-y-0.5 overflow-y-auto flex-1 no-scrollbar">
                {dayEvents.map(evt => (
                  <div 
                    key={evt.id} 
                    className={`text-[9px] sm:text-[11px] truncate px-1.5 py-0.5 rounded font-semibold shadow-sm ${!isCurrentMonth && 'opacity-40'}
                    ${evt.type === 'work' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'}`}
                  >
                    {evt.title}
                  </div>
                ))}
              </div>
            </div>
          );
        };

        const prevMonthNum = currentMonth === 0 ? 11 : currentMonth - 1;
        const prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
        for (let i = 0; i < firstDay; i++) {
          const day = prevMonthDays - firstDay + i + 1;
          days.push(renderDayCell(prevYear, prevMonthNum, day, false));
        }

        for (let day = 1; day <= daysInMonth; day++) {
          days.push(renderDayCell(currentYear, currentMonth, day, true));
        }

        const totalCells = firstDay + daysInMonth;
        const nextDays = (7 - (totalCells % 7)) % 7;
        const nextMonthNum = currentMonth === 11 ? 0 : currentMonth + 1;
        const nextYear = currentMonth === 11 ? currentYear + 1 : currentYear;
        
        for (let i = 1; i <= nextDays; i++) {
          days.push(renderDayCell(nextYear, nextMonthNum, i, false));
        }

        return days;
      };

      if (!isAuthenticated) {
        return (
          <div className="h-[100dvh] w-screen bg-slate-900 text-slate-200 flex flex-col items-center justify-between p-6 select-none overflow-hidden">
            <div className="flex-1 flex flex-col items-center justify-center w-full max-w-xs">
              <div className="w-14 h-14 bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 rounded-2xl flex items-center justify-center mb-3 shadow-lg">
                <i className="fa-solid fa-lock text-xl"></i>
              </div>
              <h2 className="text-lg font-bold text-white mb-1">내 개인 달력</h2>
              <p className="text-xs text-slate-400 mb-6 text-center">보안을 위해 4자리 비밀번호를 입력해주세요</p>
              
              {/* PIN dots indicator */}
              <div className={`flex gap-4 mb-6 ${isError ? 'animate-shake' : ''}`}>
                {[0, 1, 2, 3].map((i) => (
                  <div 
                    key={i} 
                    className={`w-4 h-4 rounded-full transition-all duration-200 ${
                      i < pin.length 
                        ? 'bg-blue-500 shadow-md shadow-blue-500/50 scale-110' 
                        : 'bg-slate-800 border border-slate-700'
                    }`}
                  ></div>
                ))}
              </div>
            </div>

            {/* Numeric Keypad */}
            <div className="w-full max-w-xs grid grid-cols-3 gap-3 pb-6">
              {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                <button
                  key={num}
                  onClick={() => handlePinPress(num.toString())}
                  className="h-14 bg-slate-800/80 hover:bg-slate-700 active:bg-slate-600 border border-slate-700/60 rounded-2xl text-xl font-bold text-white transition-all shadow-sm flex items-center justify-center"
                >
                  {num}
                </button>
              ))}
              <button
                onClick={handlePinClear}
                className="h-14 bg-slate-800/40 hover:bg-slate-700/60 active:bg-slate-600 border border-slate-800 rounded-2xl text-xs font-semibold text-slate-400 transition-all flex items-center justify-center"
              >
                전체삭제
              </button>
              <button
                onClick={() => handlePinPress('0')}
                className="h-14 bg-slate-800/80 hover:bg-slate-700 active:bg-slate-600 border border-slate-700/60 rounded-2xl text-xl font-bold text-white transition-all shadow-sm flex items-center justify-center"
              >
                0
              </button>
              <button
                onClick={handlePinDelete}
                className="h-14 bg-slate-800/40 hover:bg-slate-700/60 active:bg-slate-600 border border-slate-800 rounded-2xl text-lg text-slate-300 transition-all flex items-center justify-center"
              >
                <i className="fa-solid fa-delete-left"></i>
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="h-[100dvh] w-screen flex flex-col p-2 bg-slate-900 overflow-hidden">
          <div className="max-w-4xl w-full mx-auto bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 flex flex-col flex-1 overflow-hidden relative">
            
            {syncError && (
              <div className="bg-rose-900/90 text-white text-xs px-3 py-1 flex items-center justify-between shrink-0">
                <span>{syncError}</span>
                <button onClick={() => setSyncError(null)} className="hover:text-rose-200"><i className="fa-solid fa-xmark"></i></button>
              </div>
            )}

            {/* Header Bar */}
            <div className="flex items-center justify-between px-3.5 py-2.5 sm:px-5 sm:py-3.5 border-b border-slate-700 gap-2 shrink-0 bg-slate-800">
              <div className="flex items-center gap-2">
                <button onClick={prevMonth} className="p-1.5 hover:bg-slate-700 rounded-full transition-colors text-slate-400 hover:text-white">
                  <i className="fa-solid fa-chevron-left text-sm"></i>
                </button>
                
                <h2 
                  onClick={() => { setPickerYear(currentYear); setIsDatePickerOpen(true); }}
                  className="text-sm sm:text-lg font-bold flex items-center gap-1.5 cursor-pointer hover:bg-slate-700 px-2.5 py-1 rounded-xl transition-colors text-white group"
                >
                  <i className="fa-regular fa-calendar text-blue-500 hidden sm:block"></i>
                  {currentYear}년 {currentMonth + 1}월
                </h2>
                
                <button onClick={nextMonth} className="p-1.5 hover:bg-slate-700 rounded-full transition-colors text-slate-400 hover:text-white">
                  <i className="fa-solid fa-chevron-right text-sm"></i>
                </button>
              </div>

              <div className="flex items-center gap-1.5">
                {isLoading ? (
                   <div className="text-slate-400 text-xs flex items-center pr-1">
                     <i className="fa-solid fa-spinner fa-spin"></i>
                   </div>
                ) : (
                   <button onClick={fetchCalendarData} className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-full transition-colors" title="새로고침">
                     <i className="fa-solid fa-rotate text-xs"></i>
                   </button>
                )}
                
                <div className="relative w-28 sm:w-40">
                  <input 
                    type="text" 
                    placeholder="검색..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-7 pr-2.5 py-1 bg-slate-900 border-transparent focus:bg-slate-950 focus:border-blue-500 rounded-lg text-xs outline-none text-slate-200 placeholder-slate-500 shadow-inner"
                  />
                  <i className="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-500 text-xs"></i>
                </div>
                
                <button 
                  onClick={() => {
                    const todayStr = formatDate(currentYear, currentMonth, new Date().getDate());
                    setFormData({ id: null, startDate: todayStr, endDate: todayStr, type: 'personal', title: '', description: '' });
                    setIsEventFormOpen(true);
                  }}
                  className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition-colors whitespace-nowrap shadow-sm font-semibold text-xs"
                >
                  <i className="fa-solid fa-plus text-xs"></i>
                  <span className="hidden sm:inline">추가</span>
                </button>
              </div>
            </div>

            {/* Search Results or Calendar Grid */}
            {searchQuery.trim() ? (
              <div className="p-4 bg-slate-800 flex-1 overflow-y-auto">
                <h3 className="text-sm font-bold mb-3 flex items-center gap-1.5 text-white">
                  <i className="fa-solid fa-magnifying-glass text-blue-400 text-xs"></i> 
                  "{searchQuery}" 검색 결과 ({filteredSearchEvents.length}건)
                </h3>
                {filteredSearchEvents.length > 0 ? (
                  <div className="space-y-2">
                    {filteredSearchEvents.map(evt => (
                      <div key={evt.id} className="bg-slate-700/80 p-3 rounded-xl shadow-sm border border-slate-600 flex items-center justify-between gap-2">
                        <div>
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-xs font-medium text-slate-300 bg-slate-800 px-2 py-0.5 rounded">
                              {evt.startDate} {evt.endDate && evt.endDate !== evt.startDate ? `~ ${evt.endDate}` : ''}
                            </span>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${evt.type === 'work' ? 'bg-blue-500/20 text-blue-300 border-blue-500/30' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'}`}>
                              {evt.type === 'work' ? '업무' : '개인'}
                            </span>
                          </div>
                          <h4 className="font-bold text-white text-sm">{evt.title}</h4>
                          <p className="text-xs text-slate-400 mt-1">{evt.description}</p>
                        </div>
                        <button 
                          onClick={() => handleEditEvent(evt)}
                          className="text-xs px-3 py-1.5 bg-slate-600 hover:bg-slate-500 text-white rounded-lg transition-colors shrink-0"
                        >
                          수정
                        </button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-center text-slate-500 py-12 text-sm">검색 결과가 없습니다.</div>
                )}
              </div>
            ) : (
              <div className="p-2 sm:p-3 flex-1 flex flex-col overflow-hidden">
                <div className="grid grid-cols-7 mb-1 shrink-0">
                  {['일', '월', '화', '수', '목', '금', '토'].map((day, i) => (
                    <div key={day} className={`text-center text-xs sm:text-sm font-bold py-1
                      ${i === 0 ? 'text-rose-400' : (i === 6 ? 'text-blue-400' : 'text-slate-400')}`}>
                      {day}
                    </div>
                  ))}
                </div>
                {/* CSS grid-rows-6 ensures calendar fits precisely without scrolling */}
                <div className="grid grid-cols-7 grid-rows-6 gap-1 bg-slate-700/60 border border-slate-700 rounded-xl overflow-hidden shadow-sm flex-1">
                  {renderCalendar()}
                </div>
              </div>
            )}

            {/* Date Details Modal */}
            {selectedDateDetails && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                <div className="bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[75vh]">
                  <div className="flex items-center justify-between px-4 py-3 border-b border-slate-700 bg-slate-700/80">
                    <h3 className="font-bold text-sm flex items-center gap-2">
                      <span className="bg-slate-900 px-2 py-0.5 rounded border border-slate-600 text-blue-400 text-xs">{selectedDateDetails.day}일</span>
                      <span className="text-slate-300 text-xs font-normal">{currentYear}년 {currentMonth + 1}월</span>
                    </h3>
                    <button onClick={() => setSelectedDateDetails(null)} className="p-1.5 hover:bg-slate-600 rounded-full text-slate-400 hover:text-white transition-colors">
                      <i className="fa-solid fa-xmark text-sm"></i>
                    </button>
                  </div>
                  
                  <div className="p-3 overflow-y-auto flex-1 space-y-2.5">
                    {selectedDateDetails.events.length > 0 ? (
                      selectedDateDetails.events.map(evt => (
                        <div key={evt.id} className="bg-slate-700 p-3 rounded-xl shadow-sm border border-slate-600 relative overflow-hidden">
                          <div className={`absolute top-0 left-0 w-1.5 h-full ${evt.type === 'work' ? 'bg-blue-500' : 'bg-emerald-500'}`}></div>
                          <div className="flex items-start justify-between">
                            <div className="flex flex-col gap-1 pl-2">
                              <div className="flex items-center gap-2">
                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${evt.type === 'work' ? 'bg-blue-500/20 text-blue-300 border-blue-500/30' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'}`}>
                                  {evt.type === 'work' ? '업무' : '개인'}
                                </span>
                                <span className="text-xs text-slate-300 font-medium">
                                  {evt.startDate} {evt.endDate && evt.endDate !== evt.startDate ? `~ ${evt.endDate}` : ''}
                                </span>
                              </div>
                              <h4 className="font-bold text-white text-sm">{evt.title}</h4>
                            </div>
                            <button 
                              onClick={(e) => { e.stopPropagation(); handleEditEvent(evt); }}
                              className="text-slate-400 hover:text-blue-400 p-1.5 rounded-lg transition-colors text-xs"
                            >
                              <i className="fa-solid fa-pen"></i>
                            </button>
                          </div>
                          {evt.description && (
                            <p className="pl-2 text-xs text-slate-300 mt-2 bg-slate-800/60 p-2 rounded-lg border border-slate-600/50 whitespace-pre-wrap">{evt.description}</p>
                          )}
                        </div>
                      ))
                    ) : (
                      <div className="text-center py-8 text-slate-500 text-xs">등록된 일정이 없습니다.</div>
                    )}
                  </div>
                  
                  <div className="p-3 border-t border-slate-700 bg-slate-800">
                    <button 
                      onClick={() => {
                        setFormData({ id: null, startDate: selectedDateDetails.dateStr, endDate: selectedDateDetails.dateStr, type: 'personal', title: '', description: '' });
                        setIsEventFormOpen(true);
                      }}
                      className="w-full bg-slate-700 border border-slate-600 text-blue-400 hover:bg-slate-600 py-2 rounded-xl font-semibold transition-colors text-xs flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <i className="fa-solid fa-plus text-xs"></i> 이 날짜에 일정 추가
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Event Add/Edit Modal (with multi-day start/end support) */}
            {isEventFormOpen && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                <div className="bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden relative">
                  
                  {isSaving && (
                    <div className="absolute inset-0 bg-slate-900/70 z-10 flex flex-col items-center justify-center backdrop-blur-sm">
                      <i className="fa-solid fa-spinner fa-spin text-blue-500 mb-2 text-xl"></i>
                      <span className="text-xs font-semibold text-white">저장 중...</span>
                    </div>
                  )}

                  <div className="flex items-center justify-between px-4 py-3 border-b border-slate-700 bg-slate-700/80">
                    <h3 className="font-bold text-sm text-white">{formData.id ? '일정 수정' : '새 일정 추가'}</h3>
                    <button onClick={() => !isSaving && setIsEventFormOpen(false)} className="p-1.5 hover:bg-slate-600 rounded-full text-slate-400 hover:text-white transition-colors">
                      <i className="fa-solid fa-xmark text-sm"></i>
                    </button>
                  </div>
                  
                  <form onSubmit={handleSaveEvent} className="p-4 space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">시작일</label>
                        <input 
                          type="date" required value={formData.startDate}
                          onChange={e => setFormData({...formData, startDate: e.target.value})}
                          className="w-full p-2 bg-slate-900 border border-slate-700 rounded-xl focus:ring-1 focus:ring-blue-500 outline-none text-xs text-slate-200"
                          style={{ colorScheme: 'dark' }}
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">종료일 (연속)</label>
                        <input 
                          type="date" value={formData.endDate}
                          onChange={e => setFormData({...formData, endDate: e.target.value})}
                          className="w-full p-2 bg-slate-900 border border-slate-700 rounded-xl focus:ring-1 focus:ring-blue-500 outline-none text-xs text-slate-200"
                          style={{ colorScheme: 'dark' }}
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">구분</label>
                      <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                        <button 
                          type="button" onClick={() => setFormData({...formData, type: 'work'})}
                          className={`flex-1 py-1.5 text-xs font-bold rounded-lg flex justify-center items-center gap-1.5
                            ${formData.type === 'work' ? 'bg-slate-700 text-blue-400 border border-slate-600 shadow-sm' : 'text-slate-400'}`}
                        >
                          <i className="fa-solid fa-briefcase text-xs"></i> 업무
                        </button>
                        <button 
                          type="button" onClick={() => setFormData({...formData, type: 'personal'})}
                          className={`flex-1 py-1.5 text-xs font-bold rounded-lg flex justify-center items-center gap-1.5
                            ${formData.type === 'personal' ? 'bg-slate-700 text-emerald-300 border border-slate-600 shadow-sm' : 'text-slate-400'}`}
                        >
                          <i className="fa-solid fa-user text-xs"></i> 개인
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">제목</label>
                      <input 
                        type="text" required placeholder="예: 제주도 여행" value={formData.title}
                        onChange={e => setFormData({...formData, title: e.target.value})}
                        className="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:ring-1 focus:ring-blue-500 outline-none text-xs text-slate-200"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">상세 내용</label>
                      <textarea 
                        rows={3} placeholder="내용 입력..." value={formData.description}
                        onChange={e => setFormData({...formData, description: e.target.value})}
                        className="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:ring-1 focus:ring-blue-500 outline-none resize-none text-xs text-slate-200"
                      ></textarea>
                    </div>

                    <div className="pt-2 border-t border-slate-700 flex justify-between gap-2">
                      {formData.id && (
                        <button 
                          type="button" onClick={() => handleDeleteEvent(formData.id)} disabled={isSaving}
                          className="px-3 py-2 bg-rose-950/40 text-rose-400 rounded-xl hover:bg-rose-900/60 text-xs border border-rose-900/50 font-semibold"
                        >
                          <i className="fa-solid fa-trash"></i>
                        </button>
                      )}
                      <div className="flex gap-2 flex-1">
                        <button 
                          type="button" onClick={() => setIsEventFormOpen(false)} disabled={isSaving}
                          className="flex-1 px-3 py-2 bg-slate-700 text-slate-300 rounded-xl hover:bg-slate-600 text-xs border border-slate-600 font-semibold"
                        >취소</button>
                        <button 
                          type="submit" disabled={isSaving}
                          className="flex-1 px-3 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-500 text-xs font-semibold shadow-sm"
                        >저장</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Year/Month Picker Modal */}
            {isDatePickerOpen && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[70] p-4 backdrop-blur-sm">
                <div className="bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden">
                  <div className="flex items-center justify-between px-4 py-3 border-b border-slate-700 bg-slate-700/80">
                    <h3 className="font-bold text-sm text-white">날짜 이동</h3>
                    <button onClick={() => setIsDatePickerOpen(false)} className="p-1.5 hover:bg-slate-600 rounded-full text-slate-400 transition-colors">
                      <i className="fa-solid fa-xmark text-sm"></i>
                    </button>
                  </div>
                  
                  <div className="p-4">
                    <div className="flex items-center justify-between mb-3 bg-slate-900 border border-slate-700 p-1.5 rounded-xl">
                      <button onClick={() => setPickerYear(prev => prev - 1)} className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400">
                        <i className="fa-solid fa-chevron-left text-xs"></i>
                      </button>
                      <span className="text-sm font-bold text-white">{pickerYear}년</span>
                      <button onClick={() => setPickerYear(prev => prev + 1)} className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400">
                        <i className="fa-solid fa-chevron-right text-xs"></i>
                      </button>
                    </div>
                    
                    <div className="grid grid-cols-4 gap-1.5">
                      {Array.from({length: 12}, (_, i) => i + 1).map(month => {
                        const isSelected = pickerYear === currentYear && (month - 1) === currentMonth;
                        return (
                          <button
                            key={month}
                            onClick={() => { setCurrentDate(new Date(pickerYear, month - 1, 1)); setIsDatePickerOpen(false); }}
                            className={`py-2 rounded-xl text-xs font-bold transition-all
                              ${isSelected ? 'bg-blue-600 text-white shadow' : 'bg-slate-700 border border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                          >
                            {month}월
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  
                  <div className="p-3 border-t border-slate-700 bg-slate-700/50">
                    <button 
                      onClick={() => { setCurrentDate(new Date()); setIsDatePickerOpen(false); }}
                      className="w-full bg-slate-700 border border-slate-600 text-slate-200 hover:bg-slate-600 py-2 rounded-xl text-xs font-semibold"
                    >오늘 날짜로</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
